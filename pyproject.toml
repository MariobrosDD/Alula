[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alula"
version = "0.1.0"
description = "A six-degree-of-freedom flight dynamics simulator, built from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
gui = ["matplotlib>=3.9", "PySide6>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "matplotlib>=3.9", "PySide6>=6.7"]

[project.gui-scripts]
alula-gui = "alula.gui.app:main"

[tool.setuptools]
packages = ["alula", "alula.gui"]

[tool.setuptools.package-data]
"alula.gui" = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
